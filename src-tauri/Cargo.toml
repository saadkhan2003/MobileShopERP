[package]
name = "mobile-shop-desktop"
version = "0.4.3"
description = "Mobile Shop ERP - Professional Retail, Inventory & Repair Management"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
mobile_shop_backend = { path = "../rust" }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2.12.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.mobile_shop_backend]
opt-level = 2
